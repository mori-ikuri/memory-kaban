name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        id: dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: ga
          cache: true
          cache-dependency-path: |
            src/Bag/packages.lock.json
            tests/Bag.Tests/packages.lock.json

      - name: Select the installed .NET 10 SDK
        run: dotnet new globaljson --sdk-version "${{ steps.dotnet.outputs.dotnet-version }}" --roll-forward disable

      - name: Restore locked dependencies
        run: dotnet restore bag.slnx --locked-mode

      - name: Build
        run: dotnet build bag.slnx --configuration Release --no-restore

      - name: Test synthetic data
        env:
          BAG_TEST_ROOT: ${{ runner.temp }}/bag-tests
        run: dotnet test bag.slnx --configuration Release --no-build --no-restore
